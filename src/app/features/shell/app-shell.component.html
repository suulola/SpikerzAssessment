<div
  class="flex w-full h-screen bg-gray-soft-25 overflow-y-hidden overflow-x-visible gap-8.75 lg:pe-8.75"
>
  <div class="relative h-full hidden md:block">
    <app-sidebar
      [collapsed]="isSidebarCollapsed()"
      (menuItemClick)="onMenuItemClick($event)"
      (toggle)="toggleSidebar()"
      (logout)="onSidebarLogout()"
    />
  </div>

  @if (isMobileSidebarOpen()) {
    <div class="fixed inset-0 z-40 md:hidden">
      <div class="absolute inset-0 bg-black/20" (click)="closeMobileSidebar()"></div>
      <div class="mobile-sidebar-panel mobile-sidebar-scroll">
        <app-sidebar
          [collapsed]="false"
          (menuItemClick)="onMenuItemClick($event)"
          (toggle)="toggleSidebar()"
          (logout)="onSidebarLogout()"
        />
      </div>
    </div>
  }

  <main class="flex-1 flex flex-col overflow-hidden min-w-0">
    <p-toast
      position="top-right"
      class="bg-gray-100 rounded-2xl flex gap-2 shadow-md"
      [baseZIndex]="2000"
    />
    <div class="md:hidden">
      <div class="flex items-center gap-3 bg-white shadow-background-md px-4 py-3">
        <button
          class="w-10 h-10 rounded-full bg-gray-soft-50 text-gray-soft-700 flex items-center justify-center"
          (click)="openMobileSidebar()"
          [attr.aria-label]="'app.menu.open' | translate"
        >
          <img class="h-4 w-4" src="assets/icons/ui/icon-menu.svg" alt="" aria-hidden="true" />
        </button>
        <span class="text-base font-semibold text-gray-soft-700 tracking-base">{{
          'app.brand' | translate
        }}</span>
      </div>
    </div>
    <div class="flex-1 min-h-0 overflow-auto lg:overflow-hidden">
      <router-outlet />
    </div>
  </main>
</div>
